# =====================================================
# NEXORA E-Commerce - application configuration
# =====================================================
spring.application.name=nexora-ecommerce
server.port=8080

# Optional local overrides (git-ignored). Copy
# application-local.properties.example -> application-local.properties
spring.config.import=optional:classpath:application-local.properties

# ---------- MySQL ----------
# Values come from environment variables, with local-dev defaults.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:nexora_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12345}

# ---------- JPA / Hibernate ----------
# update = create/alter tables automatically (fine for learning;
# use Flyway/Liquibase migrations in real production systems)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Do not keep DB sessions open during JSON rendering
spring.jpa.open-in-view=false

# ---------- JWT ----------
# DEV ONLY secret. Must be at least 32 characters.
# In any shared/real environment set the JWT_SECRET env variable.
app.jwt.secret=${JWT_SECRET:nexora-dev-only-secret-key-change-me-0123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# ---------- CORS ----------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ---------- Pricing rules ----------
app.pricing.tax-rate=0.10
app.pricing.shipping-fee=50
app.pricing.free-shipping-threshold=5000

# ---------- Sample data ----------
app.seed.enabled=true

# ---------- Swagger ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ---------- Actuator ----------
management.endpoints.web.exposure.include=health,info

# ---------- Logging ----------
logging.level.com.nexora=INFO
logging.level.org.hibernate.SQL=WARN
